<!DOCTYPE html>
<html lang="en" data-identity="me">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pookie's Bowls 🥗</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="brand-emoji">🥗</span>
            <h1>Pookie's Bowls</h1>
        </div>

        <div class="identity" id="identity">
            <span class="identity-label">Who are you?</span>
            <div class="identity-toggle">
                <button type="button" class="identity-btn" data-who="me">😎 Me</button>
                <button type="button" class="identity-btn" data-who="her">🌸 Her</button>
            </div>
        </div>
    </header>

    <nav class="app-nav">
        <button type="button" class="nav-btn" data-view="ingredients">🥑 Ingredients</button>
        <button type="button" class="nav-btn" data-view="recipes">📖 Recipes</button>
    </nav>

    <main class="app-main">
        <section class="view" id="view-ingredients">
            <div class="toolbar">
                <p class="fav-hint" id="fav-hint"></p>
                <button type="button" class="secondary-btn" id="new-recipe-btn">🥣 New recipe</button>
                <button type="button" class="primary-btn" id="add-ingredient-btn">+ Add ingredient</button>
            </div>
            <p class="load-error" id="ingredients-error" hidden></p>
            <div id="ingredient-sections"></div>
        </section>

        <section class="view" id="view-recipes" hidden>
            <div class="toolbar">
                <button type="button" class="primary-btn" id="add-link-btn">+ Add link recipe</button>
            </div>
            <p class="load-error" id="recipes-error" hidden></p>
            <section class="filter-panel" id="recipe-filter" aria-label="Filter recipes" hidden>
                <div class="chips" id="recipe-filter-categories"></div>
                <div class="filter-search">
                    <input type="text" id="recipe-filter-input" autocomplete="off"
                           placeholder="🔍 Filter by ingredient…" aria-label="Filter by ingredient">
                    <ul class="filter-suggestions" id="recipe-filter-suggestions" hidden></ul>
                </div>
                <div class="filter-footer">
                    <ul class="build-picks filter-picks" id="recipe-filter-picks"></ul>
                    <span class="filter-count" id="recipe-filter-count"></span>
                    <button type="button" class="secondary-btn" id="recipe-filter-clear" hidden>Clear</button>
                </div>
            </section>
            <div id="recipe-list"></div>
        </section>
    </main>

    <dialog class="dialog" id="ingredient-dialog">
        <form id="ingredient-form" novalidate>
            <h2 id="ingredient-dialog-title">Add ingredient</h2>

            <label class="field">
                <span class="field-label">Name</span>
                <input type="text" id="ingredient-name" maxlength="80" autocomplete="off" required>
            </label>

            <fieldset class="field">
                <legend class="field-label">Categories</legend>
                <div class="chips" id="ingredient-categories"></div>
            </fieldset>

            <p class="form-error" id="ingredient-error" hidden></p>

            <div class="dialog-actions">
                <button type="button" class="danger-btn" id="ingredient-delete" hidden>Delete</button>
                <span class="spacer"></span>
                <button type="button" class="secondary-btn" id="ingredient-cancel">Cancel</button>
                <button type="submit" class="primary-btn" id="ingredient-save">Save</button>
            </div>
        </form>
    </dialog>

    <aside class="build-tray" id="build-tray" aria-label="Your recipe" hidden>
        <header class="build-tray-header">
            <h2>🥣 Your recipe</h2>
            <span class="category-count" id="build-count">0</span>
        </header>
        <ul class="build-picks" id="build-picks"></ul>
        <div class="build-tray-actions">
            <button type="button" class="secondary-btn" id="build-cancel">Cancel</button>
            <button type="button" class="primary-btn" id="build-create" disabled>Create</button>
        </div>
    </aside>

    <dialog class="dialog" id="build-dialog">
        <form id="build-form" novalidate>
            <h2 id="build-dialog-title">Name your recipe ✨</h2>

            <label class="field">
                <span class="field-label">Name</span>
                <input type="text" id="build-name" maxlength="80" autocomplete="off" required>
            </label>

            <fieldset class="field">
                <legend class="field-label">Categories</legend>
                <div class="chips" id="build-categories"></div>
            </fieldset>

            <label class="field">
                <span class="field-label">Notes</span>
                <textarea id="build-notes" rows="4" placeholder="How to make it, prep tips, what made it great…"></textarea>
            </label>

            <div class="field">
                <span class="field-label">In this recipe</span>
                <p class="build-summary" id="build-summary"></p>
            </div>

            <p class="form-error" id="build-error" hidden></p>

            <div class="dialog-actions">
                <span class="spacer"></span>
                <button type="button" class="secondary-btn" id="build-dialog-cancel">Back</button>
                <button type="submit" class="primary-btn" id="build-save">Save</button>
            </div>
        </form>
    </dialog>

    <dialog class="dialog" id="link-dialog">
        <form id="link-form" novalidate>
            <h2 id="link-dialog-title">Add link recipe 🔗</h2>

            <label class="field">
                <span class="field-label">Name</span>
                <input type="text" id="link-name" maxlength="80" autocomplete="off" required>
            </label>

            <label class="field">
                <span class="field-label">Link</span>
                <input type="url" id="link-url" inputmode="url" autocomplete="off"
                       placeholder="https://…" required>
            </label>

            <fieldset class="field">
                <legend class="field-label">Categories</legend>
                <div class="chips" id="link-categories"></div>
            </fieldset>

            <label class="field">
                <span class="field-label">Notes</span>
                <textarea id="link-notes" rows="4" placeholder="What we'd change, how it turned out…"></textarea>
            </label>

            <p class="form-error" id="link-error" hidden></p>

            <div class="dialog-actions">
                <span class="spacer"></span>
                <button type="button" class="secondary-btn" id="link-cancel">Cancel</button>
                <button type="submit" class="primary-btn" id="link-save">Save</button>
            </div>
        </form>
    </dialog>

    <dialog class="dialog" id="recipe-dialog">
        <div class="recipe-badges" id="recipe-badges"></div>
        <h2 id="recipe-title"></h2>

        <a class="recipe-link" id="recipe-url" target="_blank" rel="noopener noreferrer" hidden>Open recipe ↗</a>

        <div class="field" id="recipe-ingredients-field">
            <span class="field-label">Ingredients</span>
            <ul class="recipe-ingredients" id="recipe-ingredients"></ul>
        </div>

        <div class="field">
            <span class="field-label">Notes</span>
            <p class="recipe-notes" id="recipe-notes"></p>
        </div>

        <p class="form-error" id="recipe-error" hidden></p>

        <div class="dialog-actions">
            <button type="button" class="danger-btn" id="recipe-delete">Delete</button>
            <span class="spacer"></span>
            <button type="button" class="secondary-btn" id="recipe-edit">Edit</button>
            <button type="button" class="secondary-btn" id="recipe-close">Close</button>
        </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
