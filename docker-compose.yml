services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite database across container rebuilds/restarts.
      - ./data:/data
      # Mount the source for live reload during development.
      - .:/app
    environment:
      - DB_PATH=/data/pookie.db
      - FLASK_DEBUG=1
      # Fill a brand-new dev database with the Poke station (never in prod).
      - SEED=1
    restart: unless-stopped
